name = "staffbot-v2"
main = "src/index.js"
compatibility_date = "2026-06-15"

[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "DB"
database_name = "staffbot_v2"
database_id = "1eab53b1-b18a-4078-b511-5550c2b9e068"
migrations_dir = "db/migrations"

[triggers]
crons = ["10 * * * *"]

[vars]
CURRENCY = "$"
ENVIRONMENT = "production"
PAYROLL_LEDGER_READ_MODE = "legacy"
PAYROLL_LEDGER_WRITE_MODE = "off"
SCHEDULED_TASKS_ENABLED = "true"
TELEGRAM_RECIPIENT_MODE = "all"
MANAGE_BASE_URL = "https://staffbot-v2.staffbot-v2.workers.dev"
# Put non-secret local defaults here only.
# Use `wrangler secret put BOT_TOKEN`, `WEBHOOK_SECRET`, and `ADMIN_IDS`.

[env.staging]
workers_dev = true

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "staffbot_v2_staging"
database_id = "b4330cfc-55af-4466-ba12-1ab9d0eaa352"
migrations_dir = "db/migrations"

[[env.staging.r2_buckets]]
binding = "PAYROLL_PROOFS"
bucket_name = "staffbot-v2-payroll-proofs-staging"

[env.staging.vars]
CURRENCY = "$"
ENVIRONMENT = "staging"
PAYROLL_LEDGER_READ_MODE = "ledger"
PAYROLL_LEDGER_WRITE_MODE = "dual"
SCHEDULED_TASKS_ENABLED = "false"
TELEGRAM_RECIPIENT_MODE = "allowlist"
MANAGE_BASE_URL = "https://staffbot-v2-staging.staffbot-v2.workers.dev"

[env.staging.triggers]
crons = []
